name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install Dependencies
        run: |
          npm install @capacitor/core @capacitor/android @capacitor/cli
          
      # THIS IS THE FIX: We are removing the iframe wrapper completely.
      # Instead, we create a dummy HTML file so Capacitor doesn't crash during init.
      - name: Create minimal www directory
        run: |
          mkdir -p www
          echo "<html><body>App Starting...</body></html>" > www/index.html

      - name: Initialize Capacitor
        run: npx cap init "Pwn College" com.pwn.college.app --web-dir=www

      # CRITICAL STEP: Inject the Server Config directly into capacitor.config.json
      # This forces the app to load https://pwn.college directly (like a browser tab)
      # instead of looking at our local dummy file.
      - name: Configure Direct URL Loading
        run: |
          cat <<EOF > capacitor.config.json
          {
            "appId": "com.pwn.college.app",
            "appName": "Pwn College",
            "webDir": "www",
            "bundledWebRuntime": false,
            "android": {
              "allowMixedContent": true,
              "captureInput": true,
              "webContentsDebuggingEnabled": false
            },
            "server": {
              "url": "https://pwn.college",
              "cleartext": true
            }
          }
          EOF

      - name: Add Android Platform
        run: npx cap add android

      - name: Sync Capacitor
        run: npx cap sync

      - name: Build APK
        run: |
          cd android
          ./gradlew assembleDebug

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: pwn-college-apk-fixed
          path: android/app/build/outputs/apk/debug/app-debug.apk