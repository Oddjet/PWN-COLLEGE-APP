name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install Dependencies
        run: |
          npm install @capacitor/core @capacitor/android @capacitor/cli
          
      - name: Create www folder and index.html
        run: |
          mkdir -p www
          echo '<!DOCTYPE html><html><head><meta charset="utf-8"><title>Pwn College</title></head><body style="margin:0;padding:0;"><iframe src="https://pwn.college" style="width:100vw;height:100vh;border:none;"></iframe></body></html>' > www/index.html

      - name: Initialize Capacitor
        run: npx cap init "Pwn College" com.pwn.college.app --web-dir=www

      - name: Add Android Platform
        run: npx cap add android

      - name: Sync Capacitor
        run: npx cap sync

      - name: Build APK
        run: |
          cd android
          ./gradlew assembleDebug

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: pwn-college-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk